name: Build Android APK (Capacitor)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install

      - name: Build Web App (Vite + shadcn/ui)
        run: |
          cd mobile
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/Ayeraa-Save-Downloader-v4.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayeraa-Save-Downloader-Android-APK
          path: build-output/Ayeraa-Save-Downloader-v4.4.0.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Ayeraa-Save-Downloader-v4.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
